name: Release

# Push a tag like v1.2.0 to build a signed APK + AAB and publish them as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (code ${{ github.run_number }})"

      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and AAB
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease bundleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ github.run_number }}

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "certificate DN"

      - name: Collect artifacts
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/compass-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/compass-${{ steps.version.outputs.name }}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Compass ${{ steps.version.outputs.name }}
          files: dist/*
          generate_release_notes: true
          # Tags like v1.2.0-beta.1 are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
